services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: astra
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra_dev
    ports:
      - "5433:5432"
    volumes:
      - astra_db:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra -d astra"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://astra:astra_dev@db:5432/astra
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      ASTRA_INTERNAL_API_KEY: ${ASTRA_INTERNAL_API_KEY:-}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    ports:
      - "8001:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  scheduler:
    build:
      context: ./apps/api
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://astra:astra_dev@db:5432/astra
      CONNECTOR_AUTO_SYNC_ENABLED: "true"
      CONNECTOR_AUTO_SYNC_INTERVAL_SECONDS: "3600"
      CONNECTOR_SCHEDULER_POLL_SECONDS: "30"
    command: ["python", "-m", "app.scheduler"]
    volumes:
      - ./apps/api:/app
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      API_BASE_URL: http://api:8000
      ASTRA_INTERNAL_API_KEY: ${ASTRA_INTERNAL_API_KEY:-}
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  astra_db:
